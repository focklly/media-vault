name: diag
on:
  push:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          {
            echo "== aka doubaocdn =="
            curl -sS -o /dev/null -w "http=%{http_code} size=%{size_download}\n" -L -A "Mozilla/5.0" "https://aka.doubaocdn.com/s/ke8bzJUyEG" || echo "curl failed $?"
            echo "== headers =="
            curl -sS -D- -o /dev/null -L -A "Mozilla/5.0" "https://aka.doubaocdn.com/s/ke8bzJUyEG" | head -20 || true
            echo "== dns =="
            getent hosts aka.doubaocdn.com || true
          } > diag.txt 2>&1
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add diag.txt
          git commit -m "diag" || true
          git push origin HEAD:main
