name: sync-src
on: push
permissions:
  contents: write
concurrency:
  group: sync-src
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull source package
        run: |
          curl -fsSL -o /tmp/src.zip "https://aka.doubaocdn.com/s/GQm5SxSgyd"
          unzip -qo /tmp/src.zip -d .
      - name: Commit
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: sync source 1.2.4"
          git push
