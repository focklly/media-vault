name: ci-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        run: |
          date -u > ci-probe.txt
          git config user.name "ci-probe"
          git config user.email "ci-probe@users.noreply.github.com"
          git add ci-probe.txt
          git commit -m "chore: ci probe marker"
          git push origin HEAD:main
