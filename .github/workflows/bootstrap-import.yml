name: bootstrap-import
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download sources
        run: |
          curl -fsSL -A "Mozilla/5.0" -o /tmp/src.zip "https://aka.doubaocdn.com/s/ke8bzJUyEG"
          ls -l /tmp/src.zip
      - name: Unzip
        run: |
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          ls /tmp/src
      - name: Replace tracked dirs
        run: |
          for f in src docs tools manifest.json README.md CHANGELOG.md CONTRIBUTING.md LICENSE; do
            if [ -e "/tmp/src/$f" ]; then rm -rf "./$f"; cp -r "/tmp/src/$f" "./$f"; fi
          done
      - name: Commit and push
        run: |
          rm -f diag.txt
          git config user.name "mediavault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- . ':(exclude).github'
          git commit -m "chore: sync v1.2.1 sources" || echo "nothing to commit"
          git push origin HEAD:main
