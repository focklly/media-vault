name: bootstrap-import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and unpack source bundle
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" -o /tmp/src.zip https://aka.doubaocdn.com/s/xet5FB7j59
          unzip -o -q /tmp/src.zip -d .
          rm -f /tmp/src.zip

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "media-vault-bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "nothing to import"
            exit 0
          fi
          git commit -m "feat(v1.1.0): free storage adapters, multi-target routing, cross-storage transfer, tags"
          git push origin HEAD:main
